<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baldwin Insurance - Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #8B0000 0%, #A61F1F 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #8B0000; font-size: 28px; margin-bottom: 5px; }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #A61F1F; box-shadow: 0 0 0 3px rgba(166, 31, 31, 0.1); }
        .btn-login { width: 100%; padding: 12px; background: #8B0000; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-login:hover { background: #A61F1F; }
        .error { color: #dc3545; margin-top: 15px; padding: 12px; background: #f8d7da; border-radius: 5px; display: none; }
        .loading { display: none; text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Baldwin Insurance</h1>
            <p>Admin Portal</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="error" id="errorMsg"></div>
        <div class="loading" id="loading">Logging in...</div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();

            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/admin_login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/admin-dashboard.html';
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMsg').textContent = error.message;
                document.getElementById('errorMsg').style.display = 'block';
            });
        }
    </script>
</body>
</html>
